# Deterministic verification on every push and PR.
#
# No secrets, no deployment, no external services. It runs exactly what
# scripts/verify.sh runs locally, minus the Docker step (which needs the image
# build and is not worth the free-tier minutes on every push).
name: verify

on:
  push:
    branches: ["**"]          # every branch: a gate that only runs on
                              # main cannot stop anything reaching main
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI verifies the offline path. It has no keys, and must never
  # acquire the habit of needing them.
  NEXTATTACK_LLM_PROVIDER: 'off'

jobs:
  backend:
    name: Backend tests and API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-deploy.txt

      - name: Install slim runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-deploy.txt
          pip install pytest httpx

      # The committed artifacts are what a fresh clone gets. If one is missing the
      # tests below would skip quietly, so fail loudly here instead.
      - name: Required artifacts are committed
        run: |
          set -e
          for f in data/processed/mitre_attack/attack_lookups.pkl \
                   data/processed/evidence/index.json.gz \
                   models/ae_lanl.npz \
                   models/next_technique_markov.pkl \
                   api/cache/score_ref.json \
                   configs/vuln_priority.json \
                   reports/metrics.json \
                   data/manual/aiims_2022_casefile.json; do
            test -f "$f" || { echo "missing committed artifact: $f"; exit 1; }
          done
          echo "all required artifacts present"

      - name: Module self-checks
        run: |
          for m in src.shared.nethttp src.shared.detector src.shared.predictor \
                   src.shared.evidence src.shared.vuln src.shared.twin \
                   src.shared.rbac src.shared.audit src.shared.scoreboard \
                   src.shared.explain src.shared.claims src.shared.casefile \
                   src.shared.crosscheck src.shared.rollout src.shared.enrich src.shared.attribution src.engine3.netstate src.engine3.packets src.shared.chat_advisor src.shared.llm src.shared.workflow; do
            python -m "$m"
          done

      - name: Tests
        run: python -m pytest tests/ -q

      # These regenerate reports/metrics.json from the committed artifacts. They
      # need no network and no datasets, and they are the numbers the scoreboard
      # serves — so a change that breaks them must not merge green.
      - name: Reproduce the operational metrics
        run: |
          python -m scripts.eval_retrieval
          python -m scripts.eval_ps7 --runs 1

      - name: Dockerfile ships every runtime artifact
        # The artifact check above proves the files exist in the repo. It does not
        # prove the image copies them. That gap is exactly how ae_lanl.npz was
        # left off the COPY line once already, silently swapping the shipped
        # detector for the retired IsolationForest and applying the wrong
        # calibration anchors to it. scripts/verify.sh has always run this;
        # CI did not, so the same bug could still merge green.
        run: python -m scripts.check_dockerfile

      - name: Documented metrics are not stale
        run: python -m scripts.audit_stale

      - name: Offline API smoke test
        run: python -m scripts.smoke_api

      - name: Regenerated evidence matches what is committed
        # This used to be `git diff --stat -- reports/ || true`, which prints a
        # diff and exits 0 whatever it finds, while the comment beside it claimed
        # "a change that breaks them must not merge green". That protection did
        # not exist, and it is exactly how RESULTS.md went stale: the generator
        # was broken for several commits and CI reported success throughout.
        run: |
          if ! git diff --quiet -- reports/ RESULTS.md; then
            echo "::error::regenerated evidence differs from the committed copy."
            echo "Run the eval scripts and commit the result, or fix the generator."
            git --no-pager diff -- reports/ RESULTS.md
            exit 1
          fi
          echo "committed evidence reproduces"

      - name: Frontend tokens are all defined
        # A custom property that is used but never defined resolves to nothing,
        # so backgrounds render transparent and borders vanish, silently, in both
        # themes. Four such tokens shipped before anyone noticed.
        run: python -m scripts.check_css_tokens

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      # Vite does not typecheck; it strips types and bundles. Without this step
      # a type error rides all the way to main behind a green build, which is
      # exactly how a missing @types/three package got here.
      - run: npm run typecheck
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - name: The SPA bundle stays lean
        working-directory: frontend
        run: |
          # Guard what a visitor actually downloads, not what sits on disk.
          #
          # The old check was `du -sk dist < 4 MB`, which stopped meaning
          # anything once the 3D attack graph landed: react-force-graph-3d and
          # three.js are ~3 MB of lazy chunks that only load on /graph. Judged by
          # total size, adding a route you never visit looks identical to
          # bloating the front page.
          #
          # So: the entry is held tight, because everyone pays for it, and the
          # total gets a loose sanity bound to catch something genuinely
          # runaway. A regression that put a lazy library back into the entry --
          # which a manualChunks config silently did once -- fails the first
          # check immediately.
          entry=0
          for f in $(grep -oE '(src|href)="/assets/[^"]+"' dist/index.html                      | sed 's/.*assets\///; s/"//'); do
            [ -f "dist/assets/$f" ] || continue
            entry=$((entry + $(du -k "dist/assets/$f" | cut -f1)))
          done
          total=$(du -sk dist | cut -f1)
          echo "first paint: ${entry} KB   ·   dist total: ${total} KB"
          test "$entry" -lt 900  || { echo "first-paint payload exceeded 900 KB: a lazy library is being loaded eagerly"; exit 1; }
          test "$total" -lt 12288 || { echo "dist exceeded 12 MB"; exit 1; }
